name: Morning Focus DMs

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'default (09:00 BKK) or early (09:00 China)'
        required: false
        default: 'default'
  
jobs:
  send-dms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install slack-sdk

      - name: Send morning focus DMs
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          TARGET_GROUP: ${{ github.event.inputs.group || 'default' }}
        run: python send_morning_dms.py
