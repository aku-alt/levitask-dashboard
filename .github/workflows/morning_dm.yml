name: Morning Focus DMs

on:
  workflow_dispatch:   # manual trigger for testing
  schedule:
    - cron: '0 1 * * *'   # 08:00 BKK / 09:00 China - early group only
  
jobs:
  send-dms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install slack-sdk

      - name: Send morning focus DMs
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          TARGET_GROUP: ${{ github.event_name == 'schedule' && 'early' || 'default' }}
        run: python send_morning_dms.py
